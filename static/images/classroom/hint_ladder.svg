<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 316" font-family="'Lora', Georgia, serif">
  <text x="230" y="24" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2933">Five kinds of help, in order</text>

  <rect x="15"  y="236" width="210" height="40" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="120" y="261" text-anchor="middle" font-size="13.5" fill="#1f2933">1 · Ask a question back</text>

  <rect x="70"  y="186" width="210" height="40" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="175" y="211" text-anchor="middle" font-size="13.5" fill="#1f2933">2 · Give a hint</text>

  <rect x="125" y="136" width="210" height="40" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="230" y="161" text-anchor="middle" font-size="13.5" fill="#1f2933">3 · Show part of an example</text>

  <rect x="180" y="86"  width="210" height="40" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="285" y="111" text-anchor="middle" font-size="13.5" fill="#1f2933">4 · Show a full example</text>

  <rect x="235" y="36"  width="210" height="40" rx="8" fill="#e8f1f8" stroke="#1d6fa5" stroke-width="1.7"/>
  <text x="340" y="61" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12455f">5 · Tell the teacher</text>

  <text x="230" y="302" text-anchor="middle" font-size="11" fill="#6b7280">The help gets more detailed after two replies with no change to the student’s notes.</text>
</svg>
