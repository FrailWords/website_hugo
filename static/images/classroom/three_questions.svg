<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 236" font-family="'Lora', Georgia, serif">
  <defs>
    <marker id="tq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <text x="230" y="24" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2933">Three questions in the Research stage</text>

  <rect x="15" y="42" width="260" height="48" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="145" y="63" text-anchor="middle" font-size="12" fill="#1f2933">“Where does the water go once</text>
  <text x="145" y="79" text-anchor="middle" font-size="12" fill="#1f2933">it is inside the leaf?”</text>
  <line x1="275" y1="66" x2="303" y2="66" stroke="#1f2933" stroke-width="1.4" marker-end="url(#tq)"/>
  <rect x="303" y="42" width="142" height="48" rx="8" fill="#e8f1f8" stroke="#1d6fa5" stroke-width="1.7"/>
  <text x="374" y="63" text-anchor="middle" font-size="12.5" fill="#12455f">an explanation</text>
  <text x="374" y="79" text-anchor="middle" font-size="12.5" fill="#12455f">of the idea</text>

  <rect x="15" y="104" width="260" height="48" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="145" y="125" text-anchor="middle" font-size="12" fill="#1f2933">“Write my explanation of</text>
  <text x="145" y="141" text-anchor="middle" font-size="12" fill="#1f2933">photosynthesis for me.”</text>
  <line x1="275" y1="128" x2="303" y2="128" stroke="#1f2933" stroke-width="1.4" marker-end="url(#tq)"/>
  <rect x="303" y="104" width="142" height="48" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="374" y="133" text-anchor="middle" font-size="12.5" fill="#1f2933">a hint</text>

  <rect x="15" y="166" width="260" height="48" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="145" y="195" text-anchor="middle" font-size="12" fill="#1f2933">“Who won the cricket match yesterday?”</text>
  <line x1="275" y1="190" x2="303" y2="190" stroke="#1f2933" stroke-width="1.4" marker-end="url(#tq)"/>
  <rect x="303" y="166" width="142" height="48" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="374" y="187" text-anchor="middle" font-size="12.5" fill="#1f2933">a reminder of</text>
  <text x="374" y="203" text-anchor="middle" font-size="12.5" fill="#1f2933">the stage's goal</text>
</svg>
