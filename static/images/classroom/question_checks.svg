<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" font-family="'Lora', Georgia, serif">
  <defs>
    <marker id="qc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <text x="230" y="24" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2933">One student question, step by step</text>

  <rect x="30" y="40" width="400" height="40" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="46" y="65" font-size="12.5" fill="#1f2933">1 · The smaller model answers five questions about the message</text>
  <line x1="230" y1="80" x2="230" y2="96" stroke="#1f2933" stroke-width="1.4" marker-end="url(#qc)"/>

  <rect x="30" y="96" width="400" height="48" rx="8" fill="#e8f1f8" stroke="#1d6fa5" stroke-width="1.7"/>
  <text x="46" y="117" font-size="12.5" font-weight="600" fill="#12455f">2 · Rules decide what happens next</text>
  <text x="46" y="134" font-size="11" fill="#1f2933">following the school's own rules</text>
  <line x1="230" y1="144" x2="230" y2="160" stroke="#1f2933" stroke-width="1.4" marker-end="url(#qc)"/>

  <rect x="30" y="160" width="400" height="40" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="46" y="185" font-size="12.5" fill="#1f2933">3 · The larger model writes the reply</text>
  <line x1="230" y1="200" x2="230" y2="216" stroke="#1f2933" stroke-width="1.4" marker-end="url(#qc)"/>

  <rect x="30" y="216" width="400" height="40" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="46" y="241" font-size="12.5" fill="#1f2933">4 · The smaller model checks the reply holds back the answer</text>
  <line x1="230" y1="256" x2="230" y2="272" stroke="#1f2933" stroke-width="1.4" marker-end="url(#qc)"/>

  <rect x="30" y="272" width="400" height="40" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="46" y="297" font-size="12.5" fill="#1f2933">5 · The student sees the reply</text>
</svg>
