<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" font-family="'Lora', Georgia, serif">
  <defs>
    <marker id="rs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <rect x="15" y="24" width="120" height="48" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="75" y="53" text-anchor="middle" font-size="13.5" fill="#1f2933">Trail</text>
  <line x1="135" y1="48" x2="163" y2="48" stroke="#1f2933" stroke-width="1.4" marker-end="url(#rs)"/>

  <rect x="163" y="24" width="134" height="48" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="230" y="53" text-anchor="middle" font-size="12.5" fill="#1f2933">Numbers from the trail</text>
  <line x1="297" y1="48" x2="325" y2="48" stroke="#1f2933" stroke-width="1.4" marker-end="url(#rs)"/>

  <rect x="325" y="24" width="120" height="48" rx="8" fill="#e8f1f8" stroke="#1d6fa5" stroke-width="1.7"/>
  <text x="385" y="53" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12455f">AI's notes</text>

  <text x="230" y="98" text-anchor="middle" font-size="11" fill="#6b7280">Each note points to the moments in the trail behind that note.</text>
