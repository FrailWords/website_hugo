  <text x="110" y="69" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12455f">Class A's key</text>
  <rect x="280" y="42" width="140" height="44" rx="8" fill="#e8f1f8" stroke="#1d6fa5" stroke-width="1.7"/>
  <text x="350" y="69" text-anchor="middle" font-size="13.5" font-weight="600" fill="#12455f">Class B's key</text>

