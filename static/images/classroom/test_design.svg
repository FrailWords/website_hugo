<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" font-family="'Lora', Georgia, serif">
  <defs>
    <marker id="td" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <text x="230" y="22" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2933">How one check is tested</text>

  <rect x="10" y="70" width="110" height="48" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="65" y="91" text-anchor="middle" font-size="12" fill="#1f2933">An example</text>
  <text x="65" y="107" text-anchor="middle" font-size="12" fill="#1f2933">message</text>

  <path d="M120,84 L140,84 L140,58 L158,58" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#td)"/>
  <path d="M120,104 L140,104 L140,130 L158,130" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#td)"/>

  <rect x="158" y="36" width="160" height="44" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="238" y="55" text-anchor="middle" font-size="12" fill="#1f2933">A person's answer,</text>
  <text x="238" y="71" text-anchor="middle" font-size="12" fill="#1f2933">written down first</text>

  <rect x="158" y="108" width="160" height="44" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="238" y="127" text-anchor="middle" font-size="12" fill="#1f2933">The model's answer,</text>
  <text x="238" y="143" text-anchor="middle" font-size="12" fill="#1f2933">several runs</text>

  <path d="M318,58 L338,58 L338,84 L356,84" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#td)"/>
  <path d="M318,130 L338,130 L338,104 L356,104" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#td)"/>

  <rect x="356" y="70" width="94" height="48" rx="8" fill="#e8f1f8" stroke="#1d6fa5" stroke-width="1.7"/>
  <text x="403" y="99" text-anchor="middle" font-size="12.5" font-weight="600" fill="#12455f">Compare</text>

  <text x="230" y="178" text-anchor="middle" font-size="11" fill="#6b7280">Both models get the same instructions.</text>
</svg>
