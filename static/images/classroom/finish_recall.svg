<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 268" font-family="'Lora', Georgia, serif">
  <defs>
    <marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <text x="230" y="24" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1f2933">When a student finishes the Recall stage</text>

  <rect x="30" y="42" width="400" height="48" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="46" y="63" font-size="12.5" font-weight="600" fill="#1f2933">1 · The student’s notes</text>
  <text x="46" y="80" font-size="11" fill="#5b6570">Are there at least 40 words of notes? If not, the student stays in the Recall stage.</text>

  <line x1="230" y1="90" x2="230" y2="116" stroke="#1f2933" stroke-width="1.4" marker-end="url(#fr)"/>

  <rect x="30" y="116" width="400" height="48" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="46" y="137" font-size="12.5" font-weight="600" fill="#1f2933">2 · A check by a smaller AI model</text>
  <text x="46" y="154" font-size="11" fill="#5b6570">Are the notes on topic? If not, the student gets a gentle reminder and can still move on.</text>

  <line x1="230" y1="164" x2="230" y2="190" stroke="#1f2933" stroke-width="1.4" marker-end="url(#fr)"/>

  <rect x="30" y="190" width="400" height="44" rx="8" fill="#e8f1f8" stroke="#1d6fa5" stroke-width="1.7"/>
  <text x="230" y="217" text-anchor="middle" font-size="12.5" font-weight="600" fill="#12455f">The Research stage begins</text>

  <text x="230" y="258" text-anchor="middle" font-size="11" fill="#6b7280">The steps come from the workflow file and run in order.</text>
</svg>
