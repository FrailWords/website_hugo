<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="'Lora', Georgia, serif">
  <style>
    .h      {fill:#2f2f2f;font-size:31.6px;font-weight:600}
    .tan    {fill:#f6efe4;stroke:#cbae7e;stroke-width:1.5}
    .green  {fill:#e4ecdd;stroke:#9cbf94;stroke-width:1.5}
    .tnode  {fill:#8a6a4e}
    .gnode  {fill:#33463a}
    .edge   {fill:none;stroke:#b0b0b0;stroke-width:1.6}
    .gedge  {fill:none;stroke:#7f9a86;stroke-width:1.8}
    .ttl    {fill:#2f2f2f;font-size:22px;font-weight:600}
    .cap    {fill:#5f5f5f;font-size:19px}
    .foot   {fill:#6b6b6b;font-size:19px}
  </style>

  <defs>
    <marker id="rm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f9a86"/>
    </marker>
  </defs>

  <text x="24" y="34" class="h">Two ways to run the investigation</text>

  <!-- LEFT: decision tree -->
  <g transform="translate(24,60)">
    <rect class="tan" x="0" y="0" width="440" height="184" rx="8"/>
    <!-- fan-out tree -->
    <path class="edge" d="M220 34 L120 82 M220 34 L320 82
                          M120 82 L70 132 M120 82 L170 132
                          M320 82 L270 132 M320 82 L370 132"/>
    <circle class="tnode" cx="220" cy="34" r="8"/>
    <circle class="tnode" cx="120" cy="82" r="8"/><circle class="tnode" cx="320" cy="82" r="8"/>
    <circle class="tnode" cx="70" cy="132" r="7"/><circle class="tnode" cx="170" cy="132" r="7"/>
    <circle class="tnode" cx="270" cy="132" r="7"/><circle class="tnode" cx="370" cy="132" r="7"/>
    <text x="220" y="168" text-anchor="middle" class="cap">…and every level below</text>
  </g>
  <text x="24" y="276" class="ttl">Decision tree</text>
  <text x="24" y="302" class="cap">every branch written and kept correct by hand</text>

  <!-- RIGHT: model loop -->
  <g transform="translate(496,60)">
    <rect class="green" x="0" y="0" width="440" height="184" rx="8"/>
    <path class="gedge" d="M120 58 L330 58" marker-end="url(#rm)"/>
    <path class="gedge" d="M360 84 L360 122" marker-end="url(#rm)"/>
    <path class="gedge" d="M330 146 L120 146" marker-end="url(#rm)"/>
    <path class="gedge" d="M80 122 L80 84" marker-end="url(#rm)"/>
    <circle class="gnode" cx="80" cy="58" r="9"/><circle class="gnode" cx="360" cy="58" r="9"/>
    <circle class="gnode" cx="360" cy="146" r="9"/><circle class="gnode" cx="80" cy="146" r="9"/>
    <text x="220" y="108" text-anchor="middle" class="cap">pick · run · read · repeat</text>
  </g>
  <text x="496" y="276" class="ttl">Model + tools</text>
  <text x="496" y="302" class="cap">next step chosen from the last result</text>
</svg>
