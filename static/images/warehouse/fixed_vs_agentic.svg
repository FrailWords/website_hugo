<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 396" font-family="'Lora', Georgia, serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d6fa5"/>
    </marker>
  </defs>

  <!-- TOP: fixed pipeline -->
  <text x="230" y="26" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2933">The rest of the system</text>

  <rect x="14" y="42" width="94" height="42" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="61" y="68" text-anchor="middle" font-size="12.5" fill="#1f2933">compare</text>
  <line x1="108" y1="63" x2="126" y2="63" stroke="#1f2933" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="126" y="42" width="94" height="42" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="173" y="68" text-anchor="middle" font-size="12.5" fill="#1f2933">classify</text>
  <line x1="220" y1="63" x2="238" y2="63" stroke="#1f2933" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="238" y="42" width="94" height="42" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="285" y="68" text-anchor="middle" font-size="12.5" fill="#1f2933">move check</text>
  <line x1="332" y1="63" x2="350" y2="63" stroke="#1f2933" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="350" y="42" width="94" height="42" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.4"/>
  <text x="397" y="68" text-anchor="middle" font-size="12.5" fill="#1f2933">gate</text>

  <text x="230" y="106" text-anchor="middle" font-size="12.5" fill="#6b7280">One fixed path, the same every run.</text>

  <line x1="40" y1="126" x2="420" y2="126" stroke="#e2e6ea" stroke-width="1.2"/>

  <!-- BOTTOM: agentic loop -->
  <text x="230" y="154" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2933">The verify step</text>

  <rect x="70" y="178" width="128" height="32" rx="16" fill="#f6f7f9" stroke="#6b7280" stroke-width="1.1"/>
  <text x="134" y="199" text-anchor="middle" font-size="12.5" fill="#3d4753">scan slots</text>
  <rect x="262" y="178" width="128" height="32" rx="16" fill="#f6f7f9" stroke="#6b7280" stroke-width="1.1"/>
  <text x="326" y="199" text-anchor="middle" font-size="12.5" fill="#3d4753">rescan</text>
  <rect x="70" y="322" width="128" height="32" rx="16" fill="#f6f7f9" stroke="#6b7280" stroke-width="1.1"/>
  <text x="134" y="343" text-anchor="middle" font-size="12.5" fill="#3d4753">item master</text>
  <rect x="262" y="322" width="128" height="32" rx="16" fill="#f6f7f9" stroke="#6b7280" stroke-width="1.1"/>
  <text x="326" y="343" text-anchor="middle" font-size="12.5" fill="#3d4753">movement window</text>

  <rect x="188" y="246" width="84" height="40" rx="8" fill="#e8f1f8" stroke="#1d6fa5" stroke-width="1.7"/>
  <text x="230" y="271" text-anchor="middle" font-size="14" font-weight="600" fill="#12455f">model</text>

  <line x1="200" y1="250" x2="150" y2="212" stroke="#1d6fa5" stroke-width="1.3" marker-start="url(#a2)" marker-end="url(#a2)"/>
  <line x1="260" y1="250" x2="310" y2="212" stroke="#1d6fa5" stroke-width="1.3" marker-start="url(#a2)" marker-end="url(#a2)"/>
  <line x1="200" y1="282" x2="150" y2="320" stroke="#1d6fa5" stroke-width="1.3" marker-start="url(#a2)" marker-end="url(#a2)"/>
  <line x1="260" y1="282" x2="310" y2="320" stroke="#1d6fa5" stroke-width="1.3" marker-start="url(#a2)" marker-end="url(#a2)"/>

  <text x="230" y="380" text-anchor="middle" font-size="12.5" fill="#6b7280">The model picks the next call from the last result.</text>
</svg>
