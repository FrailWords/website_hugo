<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" font-family="'Lora', Georgia, serif">
  <style>
    .title   { fill: #2f2f2f; font-weight: 600; }
    .sub     { fill: #6b6b6b; }
    .slot    { fill: #8a8a8a; font-size: 27.5px; }
    .co-t    { fill: #2f2f2f; font-weight: 600; font-size: 28.6px; }
    .co-d    { fill: #6b6b6b; font-size: 24.2px; }
    .addr    { fill: #444; font-size: 18.7px; }
    .addr2   { fill: #8a8a8a; font-size: 18.7px; }
    .steel   { fill: #bcbcbc; }
    .wood    { fill: #d0bd97; stroke: #b6a074; stroke-width: 1.5; }
    .foot    { fill: #b6a074; }
    .bx-g    { fill: #dcece2; stroke: #8fb3a1; stroke-width: 1.5; }
    .bx-b    { fill: #dde9f6; stroke: #91b3d7; stroke-width: 1.5; }
    .bx-p    { fill: #f6e6de; stroke: #d0a08b; stroke-width: 1.5; }
    .lead    { stroke: #9b9b9b; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .dot     { fill: #9b9b9b; }
    .expl    { fill: none; stroke: #9b9b9b; stroke-width: 1.5; stroke-dasharray: 4 4; }
  </style>

  <!-- ================= title ================= -->
  <text x="336" y="40" text-anchor="middle" class="title" font-size="34.1">Rack</text>
  <text x="336" y="62" text-anchor="middle" class="sub" font-size="23.1">the steel frame</text>

  <!-- ================= rack frame ================= -->
  <!-- uprights -->
  <rect class="steel" x="110" y="80" width="14" height="620" rx="3"/>
  <rect class="steel" x="548" y="80" width="14" height="620" rx="3"/>
  <!-- beams: top, two shelves, floor -->
  <rect class="steel" x="110" y="80"  width="452" height="12" rx="3"/>
  <rect class="steel" x="110" y="278" width="452" height="12" rx="3"/>
  <rect class="steel" x="110" y="476" width="452" height="12" rx="3"/>
  <rect class="steel" x="110" y="688" width="452" height="12" rx="3"/>

  <!-- slot labels -->
  <text x="96" y="192" text-anchor="end" class="slot">Slot 3</text>
  <text x="96" y="390" text-anchor="end" class="slot">Slot 2</text>
  <text x="96" y="596" text-anchor="end" class="slot">Slot 1</text>

  <!-- ================= Slot 3: one pallet, green ================= -->
  <rect class="wood" x="236" y="262" width="200" height="16" rx="2"/>
  <rect class="foot" x="248" y="278" width="14" height="10"/>
  <rect class="foot" x="329" y="278" width="14" height="10"/>
  <rect class="foot" x="410" y="278" width="14" height="10"/>
  <rect class="bx-g" x="245" y="170" width="58" height="44" rx="6"/>
  <rect class="bx-g" x="307" y="170" width="58" height="44" rx="6"/>
  <rect class="bx-g" x="369" y="170" width="58" height="44" rx="6"/>
  <rect class="bx-g" x="245" y="218" width="58" height="44" rx="6"/>
  <rect class="bx-g" x="307" y="218" width="58" height="44" rx="6"/>
  <rect class="bx-g" x="369" y="218" width="58" height="44" rx="6"/>

  <!-- ================= Slot 2: two pallets side by side, blue ================= -->
  <!-- left pallet -->
  <rect class="wood" x="130" y="460" width="200" height="16" rx="2"/>
  <rect class="foot" x="142" y="476" width="14" height="10"/>
  <rect class="foot" x="223" y="476" width="14" height="10"/>
  <rect class="foot" x="304" y="476" width="14" height="10"/>
  <rect class="bx-b" x="139" y="368" width="58" height="44" rx="6"/>
  <rect class="bx-b" x="201" y="368" width="58" height="44" rx="6"/>
  <rect class="bx-b" x="263" y="368" width="58" height="44" rx="6"/>
  <rect class="bx-b" x="139" y="416" width="58" height="44" rx="6"/>
  <rect class="bx-b" x="201" y="416" width="58" height="44" rx="6"/>
  <rect class="bx-b" x="263" y="416" width="58" height="44" rx="6"/>
  <!-- right pallet -->
  <rect class="wood" x="340" y="460" width="200" height="16" rx="2"/>
  <rect class="foot" x="352" y="476" width="14" height="10"/>
  <rect class="foot" x="433" y="476" width="14" height="10"/>
  <rect class="foot" x="514" y="476" width="14" height="10"/>
  <rect class="bx-b" x="349" y="368" width="58" height="44" rx="6"/>
  <rect class="bx-b" x="411" y="368" width="58" height="44" rx="6"/>
  <rect class="bx-b" x="473" y="368" width="58" height="44" rx="6"/>
  <rect class="bx-b" x="349" y="416" width="58" height="44" rx="6"/>
  <rect class="bx-b" x="411" y="416" width="58" height="44" rx="6"/>
  <rect class="bx-b" x="473" y="416" width="58" height="44" rx="6"/>

  <!-- ================= Slot 1: one pallet, pink ================= -->
  <rect class="wood" x="236" y="672" width="200" height="16" rx="2"/>
  <rect class="foot" x="248" y="688" width="14" height="10"/>
  <rect class="foot" x="329" y="688" width="14" height="10"/>
  <rect class="foot" x="410" y="688" width="14" height="10"/>
  <rect class="bx-p" x="245" y="580" width="58" height="44" rx="6"/>
  <rect class="bx-p" x="307" y="580" width="58" height="44" rx="6"/>
  <rect class="bx-p" x="369" y="580" width="58" height="44" rx="6"/>
  <rect class="bx-p" x="245" y="628" width="58" height="44" rx="6"/>
  <rect class="bx-p" x="307" y="628" width="58" height="44" rx="6"/>
  <rect class="bx-p" x="369" y="628" width="58" height="44" rx="6"/>

  <!-- ================= callouts (top -> bottom: Bay, Case, Pallet) ================= -->
  <!-- each leader ends with a dot sitting exactly on its target -->

  <!-- Bay -> the vertical column: leader ends on the right upright itself -->
  <path class="lead" d="M 632 190 L 556 232"/>
  <circle class="dot" cx="556" cy="232" r="3.5"/>
  <text x="640" y="182" class="co-t">Bay</text>
  <text x="640" y="208" class="co-d">One vertical column</text>
  <text x="640" y="229" class="co-d">of the rack</text>

  <!-- Case / carton -> one box (Slot 2 right pallet, top-right box interior) -->
  <path class="lead" d="M 632 392 L 500 390"/>
  <circle class="dot" cx="500" cy="390" r="3.5"/>
  <text x="640" y="378" class="co-t">Case / carton</text>
  <text x="640" y="404" class="co-d">Cardboard box of</text>
  <text x="640" y="425" class="co-d">product on the pallet</text>

  <!-- Pallet -> the wooden base (Slot 2 right pallet base) -->
  <path class="lead" d="M 632 536 L 505 468"/>
  <circle class="dot" cx="505" cy="468" r="3.5"/>
  <text x="640" y="524" class="co-t">Pallet</text>
  <text x="640" y="550" class="co-d">Wooden platform,</text>
  <text x="640" y="571" class="co-d">moved by forklift</text>

  <!-- ================= exploded view: inside one case ================= -->
  <text x="775" y="596" text-anchor="middle" class="co-d">Inside one case</text>
  <rect class="expl" x="650" y="606" width="250" height="112" rx="10"/>
  <!-- leader from a Slot 1 box (right edge) into the container -->
  <path class="lead" d="M 427 600 L 650 628"/>
  <circle class="dot" cx="650" cy="628" r="3.5"/>
  <!-- 4 x 2 units -->
  <rect class="bx-p" x="683" y="624" width="40" height="34" rx="5"/>
  <rect class="bx-p" x="731" y="624" width="40" height="34" rx="5"/>
  <rect class="bx-p" x="779" y="624" width="40" height="34" rx="5"/>
  <rect class="bx-p" x="827" y="624" width="40" height="34" rx="5"/>
  <rect class="bx-p" x="683" y="666" width="40" height="34" rx="5"/>
  <rect class="bx-p" x="731" y="666" width="40" height="34" rx="5"/>
  <rect class="bx-p" x="779" y="666" width="40" height="34" rx="5"/>
  <rect class="bx-p" x="827" y="666" width="40" height="34" rx="5"/>
  <text x="775" y="742" text-anchor="middle" class="co-t" font-size="20">Unit / each</text>
  <text x="775" y="764" text-anchor="middle" class="co-d">one sellable item</text>

  <!-- ================= address line ================= -->
  <text x="336" y="732" text-anchor="middle" class="addr">Zone B  &#8594;  Aisle 07  &#8594;  Bay 04  &#8594;  Slot 2  &#8594;  LPN-884211</text>
  <text x="336" y="754" text-anchor="middle" class="addr2">region  &#8594;  corridor  &#8594;  column  &#8594;  shelf  &#8594;  this specific pallet</text>
</svg>
