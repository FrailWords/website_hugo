<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 452" font-family="'Lora', Georgia, serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <!-- A: claim -->
  <rect x="30" y="16" width="400" height="66" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="230" y="44" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2933">Ambiguous claim</text>
  <text x="230" y="66" text-anchor="middle" font-size="13.5" fill="#5b6570">LPN-884212 missing from B-07-04</text>

  <line x1="230" y1="82" x2="230" y2="112" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="238" y="102" font-size="11" fill="#6b7280">no recorded move explains it</text>

  <!-- 1 -->
  <rect x="30" y="112" width="400" height="62" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="46" y="139" font-size="12.5" font-weight="600" fill="#1f2933">1 · Scan the adjacent slots</text>
  <text x="46" y="160" font-size="11" fill="#5b6570">B-07-05 holds an extra pallet: LPN-884212</text>

  <line x1="230" y1="174" x2="230" y2="204" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="238" y="194" font-size="11" fill="#6b7280">is it there by a recorded move?</text>

  <!-- 2 -->
  <rect x="30" y="204" width="400" height="62" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="1.5"/>
  <text x="46" y="231" font-size="12.5" font-weight="600" fill="#1f2933">2 · Check that LPN's movement history</text>
  <text x="46" y="252" font-size="11" fill="#5b6570">only a putaway on record — no relocation</text>

  <line x1="230" y1="266" x2="230" y2="296" stroke="#1f2933" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="238" y="286" font-size="11" fill="#6b7280">a physical misplace, not a data error</text>

  <!-- 3 -->
  <rect x="30" y="296" width="400" height="62" rx="8" fill="#e8f1f8" stroke="#1d6fa5" stroke-width="1.8"/>
  <text x="46" y="323" font-size="12.5" font-weight="600" fill="#12455f">3 · Not missing. One bay over.</text>
  <text x="46" y="344" font-size="11" fill="#1f2933">Write a move-and-recount ticket.</text>

  <!-- note -->
  <text x="230" y="390" text-anchor="middle" font-size="11" fill="#6b7280">Each call is chosen from the last result. Had the neighbours been clean,</text>
  <text x="230" y="408" text-anchor="middle" font-size="11" fill="#6b7280">the movement history would decide it: genuinely missing, or a stale record.</text>
</svg>
