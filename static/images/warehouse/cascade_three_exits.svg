<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 356" font-family="'Lora', Georgia, serif">
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
    <marker id="cg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a52"/></marker>
  </defs>

  <text x="20" y="26" font-size="15" font-weight="600" fill="#1f2933">One cascade, three ways a flag can end</text>

  <!-- vertical cascade -->
  <g>
    <rect x="20" y="46" width="172" height="38" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
    <text x="34" y="63" font-size="12.5" font-weight="600" fill="#1f2933">Comparison</text><text x="34" y="78" font-size="9.5" fill="#6b7280">flags a gap</text>
    <line x1="106" y1="84" x2="106" y2="92" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ca)"/>

    <rect x="20" y="92" width="172" height="38" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
    <text x="34" y="109" font-size="12.5" font-weight="600" fill="#1f2933">Classifier</text><text x="34" y="124" font-size="9.5" fill="#6b7280">category, severity</text>
    <line x1="106" y1="130" x2="106" y2="138" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ca)"/>

    <rect x="20" y="138" width="172" height="38" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
    <text x="34" y="155" font-size="12.5" font-weight="600" fill="#1f2933">Cheap check</text><text x="34" y="170" font-size="9.5" fill="#6b7280">movement log</text>
    <line x1="106" y1="176" x2="106" y2="184" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ca)"/>

    <rect x="20" y="184" width="172" height="38" rx="7" fill="#e8f1f8" stroke="#1d6fa5" stroke-width="1.6"/>
    <text x="34" y="201" font-size="12.5" font-weight="600" fill="#12455f">Verifier</text><text x="34" y="216" font-size="9.5" fill="#4a5a68">model judgment</text>
    <line x1="106" y1="222" x2="106" y2="230" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ca)"/>

    <rect x="20" y="230" width="172" height="38" rx="7" fill="#ffffff" stroke="#1f2933" stroke-width="1.3"/>
    <text x="34" y="247" font-size="12.5" font-weight="600" fill="#1f2933">Human</text><text x="34" y="262" font-size="9.5" fill="#6b7280">review</text>
    <line x1="106" y1="268" x2="106" y2="276" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ca)"/>

    <rect x="20" y="276" width="172" height="38" rx="7" fill="#eef4ef" stroke="#4f8a63" stroke-width="1.4"/>
    <text x="34" y="293" font-size="12.5" font-weight="600" fill="#2f5e40">Ticket</text><text x="34" y="308" font-size="9.5" fill="#4a6a54">remediation on the floor</text>
  </g>

  <!-- exits -->
  <line x1="192" y1="111" x2="228" y2="111" stroke="#c98a52" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cg)"/>
  <text x="234" y="108" font-size="10.5" font-weight="600" fill="#8a5a2a">B-09-01 leaves as a note</text>
  <text x="234" y="123" font-size="9.5" fill="#6b7280">low severity, count matches</text>

  <line x1="192" y1="157" x2="228" y2="157" stroke="#c98a52" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cg)"/>
  <text x="234" y="154" font-size="10.5" font-weight="600" fill="#8a5a2a">B-12-01 is dropped</text>
  <text x="234" y="169" font-size="9.5" fill="#6b7280">a recorded move explains it</text>

  <line x1="192" y1="295" x2="228" y2="295" stroke="#4f8a63" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#cg)"/>
  <text x="234" y="292" font-size="10.5" font-weight="600" fill="#2f5e40">B-07-04 / B-07-05</text>
  <text x="234" y="307" font-size="9.5" fill="#6b7280">the misplaced pallet runs the</text>
  <text x="234" y="320" font-size="9.5" fill="#6b7280">full length to a ticket</text>
</svg>
