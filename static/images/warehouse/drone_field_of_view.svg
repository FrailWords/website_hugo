<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Lora', Georgia, serif">
  <style>
    .title { fill:#2f2f2f; font-weight:600; font-size:22px; }
    .steel { fill:#bcbcbc; }
    .wood  { fill:#d0bd97; stroke:#b6a074; stroke-width:1.5; }
    .box   { fill:#dde9f6; stroke:#91b3d7; stroke-width:1.5; }
    .plate { fill:#ffffff; stroke:#c7ccd2; stroke-width:1.5; }
    .pbar  { fill:#3a3a3a; }
    .cone  { fill:#eef4fa; stroke:#bcd3e6; stroke-width:1.5; stroke-dasharray:5 4; }
    .drone { fill:#7f8a94; }
    .rotor { fill:none; stroke:#7f8a94; stroke-width:2.5; }
    .co-t  { fill:#2f2f2f; font-weight:600; font-size:15px; }
    .co-d  { fill:#6b6b6b; font-size:13px; }
    .note  { fill:#6b6b6b; font-size:14px; }
    .lead  { stroke:#9b9b9b; stroke-width:1.5; stroke-dasharray:4 4; fill:none; }
    .dot   { fill:#9b9b9b; }
  </style>

  <text x="480" y="40" text-anchor="middle" class="title">What the drone can see</text>

  <!-- ================= rack (side-on) ================= -->
  <rect class="steel" x="90"  y="70" width="12" height="400" rx="3"/>
  <rect class="steel" x="300" y="70" width="12" height="400" rx="3"/>
  <rect class="steel" x="90" y="70"  width="222" height="10" rx="3"/>
  <rect class="steel" x="90" y="200" width="222" height="10" rx="3"/>
  <rect class="steel" x="90" y="330" width="222" height="10" rx="3"/>
  <rect class="steel" x="90" y="460" width="222" height="10" rx="3"/>

  <!-- three shelves: pallet base + boxes + a label plate on the front edge -->
  <g>
    <!-- shelf 3 -->
    <rect class="wood" x="120" y="184" width="150" height="14"/>
    <rect class="box"  x="128" y="132" width="60" height="50" rx="5"/>
    <rect class="box"  x="196" y="132" width="60" height="50" rx="5"/>
    <rect class="plate" x="120" y="150" width="26" height="34"/>
    <rect class="pbar" x="124" y="156" width="18" height="3"/><rect class="pbar" x="124" y="162" width="18" height="3"/><rect class="pbar" x="124" y="168" width="18" height="3"/>
    <!-- shelf 2 -->
    <rect class="wood" x="120" y="314" width="150" height="14"/>
    <rect class="box"  x="128" y="262" width="60" height="50" rx="5"/>
    <rect class="box"  x="196" y="262" width="60" height="50" rx="5"/>
    <rect class="plate" x="120" y="280" width="26" height="34"/>
    <rect class="pbar" x="124" y="286" width="18" height="3"/><rect class="pbar" x="124" y="292" width="18" height="3"/><rect class="pbar" x="124" y="298" width="18" height="3"/>
    <!-- shelf 1 -->
    <rect class="wood" x="120" y="444" width="150" height="14"/>
    <rect class="box"  x="128" y="392" width="60" height="50" rx="5"/>
    <rect class="box"  x="196" y="392" width="60" height="50" rx="5"/>
    <rect class="plate" x="120" y="410" width="26" height="34"/>
    <rect class="pbar" x="124" y="416" width="18" height="3"/><rect class="pbar" x="124" y="422" width="18" height="3"/><rect class="pbar" x="124" y="428" width="18" height="3"/>
  </g>

  <!-- ================= vision cone from the drone ================= -->
  <path class="cone" d="M 690 265 L 320 95 L 320 455 Z"/>

  <!-- ================= drone icon ================= -->
  <g transform="translate(690,250)">
    <rect class="drone" x="-6" y="-12" width="70" height="26" rx="8"/>
    <!-- camera nub, facing the rack -->
    <rect class="drone" x="-22" y="-6" width="18" height="14" rx="3"/>
    <circle cx="-22" cy="1" r="5" fill="#3a3a3a"/>
    <!-- arms + rotors -->
    <line x1="6" y1="0" x2="-16" y2="-26" stroke="#7f8a94" stroke-width="3"/>
    <line x1="6" y1="0" x2="-16" y2="26"  stroke="#7f8a94" stroke-width="3"/>
    <line x1="52" y1="0" x2="74" y2="-26" stroke="#7f8a94" stroke-width="3"/>
    <line x1="52" y1="0" x2="74" y2="26"  stroke="#7f8a94" stroke-width="3"/>
    <ellipse class="rotor" cx="-16" cy="-26" rx="16" ry="5"/>
    <ellipse class="rotor" cx="-16" cy="26"  rx="16" ry="5"/>
    <ellipse class="rotor" cx="74"  cy="-26" rx="16" ry="5"/>
    <ellipse class="rotor" cx="74"  cy="26"  rx="16" ry="5"/>
  </g>
  <text x="690" y="330" text-anchor="middle" class="co-d">flying camera, no thinking</text>

  <!-- ================= callouts (dots land on the target) ================= -->
  <!-- to the shelf-2 label plate -->
  <path class="lead" d="M 133 297 L 133 200 L 470 200"/>
  <circle class="dot" cx="133" cy="297" r="3.5"/>
  <text x="482" y="196" class="co-t">The LPN barcode</text>
  <text x="482" y="217" class="co-d">read by a vision model, after the flight</text>

  <!-- to a shelf-3 box -->
  <path class="lead" d="M 226 157 L 226 110 L 470 110"/>
  <circle class="dot" cx="226" cy="157" r="3.5"/>
  <text x="482" y="106" class="co-t">How full the slot looks</text>
  <text x="482" y="127" class="co-d">plus pallet count, lot codes, dates</text>

  <text x="480" y="502" text-anchor="middle" class="note">One vertical pass covers the whole aisle, floor to top.</text>
</svg>
