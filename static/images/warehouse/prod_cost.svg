<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Lora', Georgia, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a949e"/></marker>
  </defs>
  <style>
    .htag{fill:#9aa3ab;font-size:11px;font-weight:600;letter-spacing:2px}
    .htxt{fill:#2f2f2f;font-size:18px;font-weight:600}
    .why {fill:#6b6b6b;font-size:14px}
    .colh{fill:#7a838c;font-size:12px;font-weight:600;letter-spacing:1px}
    .stage{fill:#33383d;font-size:14px;font-weight:600}
    .sub {fill:#8a8a8a;font-size:12px}
    .cheap{fill:#eef1f4;stroke:#b9c4cd;stroke-width:1.5}
    .model{fill:#e4ecdd;stroke:#9cbf94;stroke-width:1.5}
    .human{fill:#f6efe4;stroke:#cbae7e;stroke-width:1.5}
    .flow{stroke:#8a949e;stroke-width:1.8;fill:none;marker-end:url(#a)}
    .need{fill:#ffffff;stroke:#b9c4cd;stroke-width:1.5;stroke-dasharray:5 4}
    .lead{stroke:#9b9b9b;stroke-width:1.5;stroke-dasharray:4 4;fill:none}
    .dot {fill:#9b9b9b}
    .scale{fill:#8a8a8a;font-size:12px;font-weight:600;letter-spacing:1px}
  </style>

  <text x="60" y="40" class="htag">FOCUS</text>
  <text x="60" y="64" class="htxt">Keeping spend predictable with paid model calls in the loop</text>
  <text x="60" y="92" class="why">If the cheap check stops resolving, everything escalates and cost climbs silently.</text>

  <text x="60" y="134" class="colh">THE CASCADE, CHEAPEST FIRST</text>

  <!-- funnel: three stages, widening cost -->
  <rect class="cheap" x="60"  y="150" width="150" height="120" rx="6"/>
  <text x="135" y="205" text-anchor="middle" class="stage">Cheap check</text>
  <text x="135" y="226" text-anchor="middle" class="sub">Postgres, ~free</text>

  <rect class="model" x="240" y="164" width="150" height="92" rx="6"/>
  <text x="315" y="205" text-anchor="middle" class="stage">Verifier</text>
  <text x="315" y="226" text-anchor="middle" class="sub">paid, token-capped</text>

  <rect class="human" x="420" y="178" width="150" height="64" rx="6"/>
  <text x="495" y="205" text-anchor="middle" class="stage">Human</text>
  <text x="495" y="226" text-anchor="middle" class="sub">costliest</text>

  <path class="flow" d="M 210 210 L 238 210"/>
  <path class="flow" d="M 390 210 L 418 210"/>

  <text x="60"  y="300" class="scale">$</text>
  <text x="565" y="300" text-anchor="end" class="scale">$$$</text>
  <line x1="60" y1="286" x2="565" y2="286" stroke="#d5d5d5" stroke-width="1.5"/>

  <!-- cost meter, not built -->
  <path class="lead" d="M 495 178 L 640 150"/>
  <circle class="dot" cx="495" cy="178" r="3.5"/>
  <rect class="need" x="640" y="150" width="250" height="120" rx="6"/>
  <text x="656" y="178" class="stage">Not built</text>
  <text x="656" y="204" class="sub">&#183; token &amp; call counts per run</text>
  <text x="656" y="226" class="sub">&#183; a spend ceiling per zone run</text>
  <text x="656" y="248" class="sub">&#183; alert when escalation rate spikes</text>
</svg>
