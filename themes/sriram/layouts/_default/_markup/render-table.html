{{ $header := index .THead 0 }}
<div class="table-scroll">
<table>
  {{ if .THead }}
  <thead>
    {{ range .THead }}
    <tr>{{ range . }}<th>{{ .Text | safeHTML }}</th>{{ end }}</tr>
    {{ end }}
  </thead>
  {{ end }}
  <tbody>
    {{ range .TBody }}
    <tr>
      {{ range $i, $cell := . }}<td{{ with $header }}{{ with index . $i }} data-label="{{ .Text | plainify }}"{{ end }}{{ end }}>{{ $cell.Text | safeHTML }}</td>{{ end }}
    </tr>
    {{ end }}
  </tbody>
</table>
</div>
