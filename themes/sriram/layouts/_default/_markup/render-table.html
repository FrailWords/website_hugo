<div class="table-scroll">
<table>
  {{ if .THead }}
  <thead>
    {{ range .THead }}
    <tr>{{ range . }}<th>{{ .Text | safeHTML }}</th>{{ end }}</tr>
    {{ end }}
  </thead>
  {{ end }}
  <tbody>
    {{ range .TBody }}
    <tr>{{ range . }}<td>{{ .Text | safeHTML }}</td>{{ end }}</tr>
    {{ end }}
  </tbody>
</table>
</div>
