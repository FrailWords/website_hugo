{{ define "main" }}
<article>
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      {{ with .Params.website }}<a href="{{ . }}">Website</a>{{ end }}
      {{ with .Params.repo }} · <a href="{{ . }}">GitHub</a>{{ end }}
      {{ with .Params.appstore }} · <a href="{{ . }}">App Store</a>{{ end }}
      {{ with .Params.playstore }} · <a href="{{ . }}">Play Store</a>{{ end }}
    </div>
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
